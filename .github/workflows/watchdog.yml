name: watchdog

# Daily monitor: verifies the scrape loop actually ran and succeeded
# (the worker itself sends a daily alive ping + instant failure alerts).
# Sends a Telegram alert to the admin if the last run failed or is too old.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # manual test button

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check last check-run
        run: |
          RUN=$(gh api "repos/1khvled/affichagebot/actions/workflows/scrape.yml/runs?per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion)|\(.updated_at)|\(.html_url)"')
          CONC="${RUN%%|*}"; REST="${RUN#*|}"; TS="${REST%%|*}"; URL="${REST##*|}"
          AGE=$(( $(date +%s) - $(date -d "$TS" +%s) ))
          echo "last run: conclusion=$CONC age=${AGE}s url=$URL"
          if [ "$CONC" != "success" ] || [ "$AGE" -gt 10800 ]; then
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d chat_id="$ADMIN_CHAT_ID" \
              -d text="WATCHDOG: probleme scrape (dernier run: $CONC, il y a ${AGE}s). $URL" > /dev/null
            echo "ALERT SENT"
          else
            echo "OK"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
